<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Account</title>
  <link rel="shortcut icon" href="./images/ricks_radar_logo.png" type="image/png">

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- Scripts -->
  <script type="module" src="backend/pages/account-page.js"></script>
</head>

<body>

  <!-- Overlay -->
  <div id="menu-overlay"></div>

  <!-- Slide-out Menu -->
  <nav id="side-menu">
    <h2>Menu</h2>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="add-deal.html">Add Deal</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="account.html">Account</a></li>
      <li><button id="logout-btn" class="logout-btn">Logout</button></li>
    </ul>
  </nav>

  <!-- Top Bar -->
  <header class="top-bar">
    <button class="top-btn top-btn--secondary" id="menu-btn">☰ Menu</button>
  </header>

  <!-- Page Container -->
  <div class="page">

    <!-- Profile Header -->
    <section class="profile-header">
      <img class="profile-avatar" src="https://via.placeholder.com/120" alt="avatar">

      <h2 class="profile-name">NAME</h2>
      <p class="profile-bio">Local foodie. Deal hunter. Always exploring Rexburg eats.</p>
      <button id="edit-profile-btn" class="top-btn top-btn--secondary profile-edit-toggle">Edit Profile</button>

      <form id="edit-profile-form" class="profile-edit-form" style="display:none;">
        <label for="edit-bio">Update Bio</label>
        <textarea id="edit-bio" rows="3" placeholder="Tell us about yourself..."></textarea>

        <label for="edit-profile-image">Update Profile Picture</label>
        <input id="edit-profile-image" type="file" accept="image/*">

        <div class="profile-edit-actions">
          <button id="save-profile-btn" type="submit" class="top-btn">Save Changes</button>
          <button id="cancel-profile-btn" type="button" class="top-btn top-btn--secondary">Cancel</button>
        </div>

        <p id="edit-profile-message" class="profile-edit-message" aria-live="polite"></p>
      </form>

      <div class="profile-stats">
        <div>
          <strong>12</strong>
          <span>Deals Posted</span>
        </div>
        <div>
          <strong>480</strong>
          <span>Likes</span>
        </div>
        <div>
          <strong>132</strong>
          <span>Followers</span>
        </div>
        <div>
          <strong>75</strong>
          <span>Saved</span>
        </div>
      </div>
    </section>

    <!-- Deals Section -->
    <h3 class="section-title">Your Deals</h3>

    <main class="deals">

      <!-- Example Deal -->
      <article class="deal-card">
        <div class="deal-main">
          <div class="deal-picture">Pic</div>

          <div class="deal-info">
              <div class="deal-tag">
              <strong>20% OFF</strong>
            </div>

            <h2 class="deal-title">Taco Tuesday Special</h2>

            <div class="deal-meta">
              <button class="badge badge--likes">👍 120</button>
              <button class="badge badge--dislikes">👎 12</button>
            </div>
          </div>
        </div>

        <div class="deal-details">
          <div><span class="label">Location:</span> Main Street</div>
          <div><span class="label">Time:</span> Tuesdays 5–9 PM</div>
        </div>
      </article>

    </main>

  </div>

</body>
</html>
