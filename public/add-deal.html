<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add a Deal</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <script type="module" src="backend/pages/add-deal-page.js"></script>
  <style>
   /* Categories Section */
.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.pill {
  border-radius: 999px;
  padding: 0.4rem 0.9rem;
  font-size: 0.85rem;
  border: 1px solid rgba(0, 0, 0, 0.08);
  background: #fff;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
  color: #000;
}

.pill span.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.food span.dot { background: var(--green); }
.groceries span.dot { background: var(--blue); }
.services span.dot { background: var(--orange); }
.other span.dot { background: var(--grey); }

.categories .pill.active {
  background-color: #000;
  color: #fff;
  filter: brightness(1);
}

.deal-time-row {
  display: grid;
  gap: 0.75rem;
}

.input-hint {
  font-size: 0.78rem;
  color: #555;
  margin-top: -0.35rem;
}

.themed-date {
  background: linear-gradient(180deg, #fff, #f6f9ff);
  border: 1px solid rgba(2, 107, 227, 0.28);
  color: #14304e;
  font-weight: 600;
}

.themed-date:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(2, 107, 227, 0.18);
}

.file-picker-wrap {
  padding: 0.75rem;
  border-radius: 12px;
  border: 1px dashed rgba(2, 107, 227, 0.35);
  background: linear-gradient(180deg, #f8fbff, #f3fff7);
}

.themed-file {
  width: 100%;
  border: 0;
  padding: 0;
  background: transparent;
}

.themed-file::file-selector-button {
  border: 0;
  border-radius: 999px;
  padding: 0.45rem 0.9rem;
  background: var(--blue);
  color: #fff;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  margin-right: 0.65rem;
}

.themed-file::file-selector-button:hover {
  background: #015ac0;
}

.form-message {
  min-height: 1.2rem;
  margin-top: 0.2rem;
  font-size: 0.88rem;
}
  </style>
</head>

<body class="auth-body">

  <!-- Slide-out Menu -->
  <div id="menu-overlay"></div>
  <nav id="side-menu">
    <h2>Menu</h2>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="add-deal.html">Add Deal</a></li>
      <li><a href="account.html">Account</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><button id="logout-btn" class="logout-btn">Logout</button></li>
    </ul>
  </nav>

  <!-- Top Bar -->
  <header class="top-bar">
    <button class="top-btn top-btn--secondary" id="menu-btn">Menu</button>
  </header>

  <div class="auth-card" style="margin-top:5rem;">
    <h1 class="auth-title">Add a Deal</h1>

    <form id="add-deal-form" class="auth-form">
      <label for="deal-title">Deal Title</label>
      <input id="deal-title" name="title" type="text" placeholder="50% Off Burgers" required>

      <label for="deal-discount">Discount type/title</label>
      <input id="deal-discount" name="discountText" type="text" placeholder="50%" required>

      <label for="deal-description">Description</label>
      <textarea id="deal-description" name="description" placeholder="Describe the deal..." rows="3" required></textarea>

      <label>Categories</label>
      <div class="categories">
        <button type="button" class="pill category food" data-value="food">
          <span class="dot"></span> Food
        </button>
        <button type="button" class="pill category groceries" data-value="groceries">
          <span class="dot"></span> Groceries
        </button>
        <button type="button" class="pill category services" data-value="services">
          <span class="dot"></span> Services
        </button>
        <button type="button" class="pill category other" data-value="other">
          <span class="dot"></span> Other
        </button>
      </div>

      <input type="hidden" name="categories" id="selected-categories">

      <label for="deal-location">Location</label>
      <input id="deal-location" name="location" type="text" placeholder="Downtown Rexburg" required>

      <div class="deal-time-row">
        <label for="deal-time-info">Time / Date Details</label>
        <input id="deal-time-info" name="timeInfo" type="text" placeholder="Fri-Sun, 5 PM - 9 PM" required>
      </div>

      <label for="expiration-date">Expiration Date</label>
      <input class="themed-date" type="date" id="expiration-date" name="expirationDate" required>
      <p class="input-hint">Set when this deal should disappear.</p>

      <div class="image-upload file-picker-wrap">
        <label for="deal-image">Upload Image (Optional)</label>
        <input class="themed-file" id="deal-image" name="dealImage" type="file" accept="image/*">
      </div>

      <p id="add-deal-message" class="form-message" aria-live="polite"></p>
      <button id="submit-deal-btn" class="auth-btn" type="submit">Submit Deal</button>
    </form>
  </div>

</body>
</html>
