<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add a Deal</title>
  <link rel="shortcut icon" href="./images/ricks_radar_logo.png" type="image/png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <script type="module" src="backend/pages/add-deal-page.js"></script>
  <style>
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .pill {
      border-radius: 999px;
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: #fff;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      color: #000;
    }

    .pill span.dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .food span.dot { background: var(--green); }
    .groceries span.dot { background: var(--blue); }
    .services span.dot { background: var(--orange); }
    .other span.dot { background: var(--grey); }

    .categories .pill.active {
      background-color: #000;
      color: #fff;
      filter: brightness(1);
    }

    #add-deal-message {
      min-height: 1.2rem;
      margin-top: 0.25rem;
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>

<body class="auth-body">
  <div id="menu-overlay"></div>
  <nav id="side-menu">
    <h2>Menu</h2>
        <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="add-deal.html">Add Deal</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="account.html">Account</a></li>
      <li><button id="logout-btn" class="logout-btn">Logout</button></li>
    </ul>
  </nav>

  <header class="top-bar">
    <button class="top-btn top-btn--secondary" id="menu-btn">Menu</button>
  </header>

  <div class="auth-card" style="margin-top:5rem;">
    <h1 class="auth-title">Add a Deal</h1>

    <form class="auth-form" id="add-deal-form">
      <label for="deal-title">Deal Title</label>
      <input id="deal-title" type="text" placeholder="50% Off Burgers" required>

      <label for="deal-discount">Discount type/title</label>
      <input id="deal-discount" type="text" placeholder="50%" required>

      <label for="deal-description">Description</label>
      <textarea id="deal-description" placeholder="Describe the deal..." rows="3" required></textarea>

      <label>Categories</label>
      <div class="categories">
        <button type="button" class="pill category food" data-value="food">
          <span class="dot"></span> Food
        </button>
        <button type="button" class="pill category groceries" data-value="groceries">
          <span class="dot"></span> Groceries
        </button>
        <button type="button" class="pill category services" data-value="services">
          <span class="dot"></span> Services
        </button>
        <button type="button" class="pill category other" data-value="other">
          <span class="dot"></span> Other
        </button>
      </div>

      <input type="hidden" name="categories" id="selected-categories">

      <label for="deal-location">Location</label>
      <input id="deal-location" type="text" placeholder="Downtown Rexburg" required>

      <label for="deal-time">Time / Date</label>
      <input id="deal-time" type="text" placeholder="Fri-Sun, 5 PM - 9 PM" required>

      <label for="expiration-date">Expiration Date</label>
      <input type="date" id="expiration-date" required>

      <div class="image-upload">
        <label for="deal-image">Upload Image (Optional)</label>
        <input id="deal-image" type="file" accept="image/*">
      </div>

      <button id="submit-deal-btn" class="auth-btn" type="submit">Submit Deal</button>
      <p id="add-deal-message" aria-live="polite"></p>
    </form>
  </div>
</body>
</html>
