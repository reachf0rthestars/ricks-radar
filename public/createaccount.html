<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account & Profile</title>
  <link rel="shortcut icon" href="./images/ricks_radar_logo.png" type="image/png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <style>
    .auth-body {
      min-height: 100vh;
      background: var(--bg);
      padding-top: 80px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .auth-card h1 {
      text-align: center;
      margin-bottom: 1rem;
    }

    /* Center the Google button */
    #google-signup {
      display: block;
      margin: 0 auto;
      width: 100%;
      text-align: center;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .auth-form input,
    .auth-form textarea {
      padding: 0.6rem 0.8rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .auth-btn {
      margin-top: 1rem;
      padding: 0.7rem;
      border: none;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .profile-preview {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .profile-preview img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }
  </style>
</head>

<body class="auth-body">

  <!-- Overlay -->
  <div id="menu-overlay"></div>

  <!-- Slide-out Menu -->
  <nav id="side-menu">
    <h2>Menu</h2>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="add-deal.html">Add Deal</a></li>
      <li><a href="account.html">Account</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><button class="logout-btn" id="logout-btn">Logout</button></li>
    </ul>
  </nav>

  <!-- Top Bar -->
  <header class="top-bar">
    <button class="top-btn top-btn--secondary" id="menu-btn">☰ Menu</button>
  </header>

  <!-- Auth Card -->
  <div class="auth-card">
    <h1>Create Your Profile</h1>

    <!-- Centered Google Button -->
    <button id="google-signup" class="auth-btn">Sign in with Google</button>

    <form id="profile-form" class="auth-form" style="display:none;">
      <div class="profile-preview">
        <img id="profile-img-preview" src="https://via.placeholder.com/100" alt="Profile Preview">
      </div>

      <label>Username</label>
      <input type="text" id="username" placeholder="Choose a username" required>

      <label>Bio / Description</label>
      <textarea id="bio" rows="3" placeholder="Tell us about yourself..." required></textarea>

      <label>Profile Image (optional)</label>
      <input type="file" id="profileImage" accept="image/*">

      <button type="submit" class="auth-btn">Save Profile</button>
    </form>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    // Google Sign-in
    const googleBtn = document.getElementById('google-signup');
    const profileForm = document.getElementById('profile-form');
    let currentUser = null;

    googleBtn.addEventListener('click', async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await auth.signInWithPopup(provider);
        currentUser = result.user;

        googleBtn.style.display = 'none';
        profileForm.style.display = 'flex';

        document.getElementById('profile-img-preview').src =
          currentUser.photoURL || 'https://via.placeholder.com/100';

      } catch (err) {
        alert(err.message);
      }
    });

    // Save Profile
    profileForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const bio = document.getElementById('bio').value.trim();
      const file = document.getElementById('profileImage').files[0];

      let profileImageURL = currentUser.photoURL || '';

      if (file) {
        const storageRef = storage.ref(`profileImages/${currentUser.uid}_${file.name}`);
        await storageRef.put(file);
        profileImageURL = await storageRef.getDownloadURL();
      }

      await db.collection('users').doc(currentUser.uid).set({
        username,
        displayName: currentUser.displayName,
        email: currentUser.email,
        bio,
        profileImage: profileImageURL,
        dealsPosted: 0,
        likes: 0,
        followers: 0,
        savedDeals: 0
      });

      window.location.href = 'account.html';
    });

    // Slide-out Menu Logic
    const menuBtn = document.getElementById('menu-btn');
    const sideMenu = document.getElementById('side-menu');
    const overlay = document.getElementById('menu-overlay');

    menuBtn.addEventListener('click', () => {
      sideMenu.classList.add('active');
      overlay.classList.add('active');
    });

    overlay.addEventListener('click', () => {
      sideMenu.classList.remove('active');
      overlay.classList.remove('active');
    });
  </script>

</body>
</html>
