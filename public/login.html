<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <script type="module" src="backend/pages/login-page.js"></script>

  <style>
    /* Center the login card while keeping menu overlay functional */
    .auth-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 120px; /* space for fixed top bar */
      min-height: 100vh;
      background: var(--bg);
    }
  </style>
</head>

<body class="auth-body">

  <!-- Overlay -->
  <div id="menu-overlay"></div>

  <!-- Slide-out Menu -->
  <nav id="side-menu">
    <h2>Menu</h2>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="add-deal.html">Add Deal</a></li>
      <li><a href="account.html">Account</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><button id="logout-btn" class="logout-btn">Logout</button></li>
    </ul>
  </nav>

  <!-- Top Bar -->
  <header class="top-bar">
    <button class="top-btn top-btn--secondary" id="menu-btn">☰ Menu</button>
  </header>

  <!-- Login Card -->
  <div class="auth-card">
    <h1 class="auth-title">Sign In</h1>

    <button id="google-login" class="auth-btn google-btn">
      Sign in with Google
    </button>

    <p class="auth-footer">
      You must sign in to add deals or manage your account.
    </p>

    <p class="auth-footer">
      Don't have an account?
      <a href="createaccount.html">Create Account</a>
    </p>

    <p id="login-message" class="auth-footer" aria-live="polite"></p>
  </div>

</body>
</html>
