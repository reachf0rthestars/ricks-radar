<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rick's Radar - Deals</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <script type="module" src="backend/pages/index-page.js"></script>
</head>

<body>
  <div id="menu-overlay"></div>

  <nav id="side-menu">
    <h2>Menu</h2>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="add-deal.html">Add Deal</a></li>
      <li><a href="account.html">Account</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><button id="logout-btn" class="logout-btn">Logout</button></li>
    </ul>
  </nav>

  <div class="page">
    <header class="top-bar">
      <button class="top-btn top-btn--secondary" id="menu-btn">Menu</button>
    </header>

    <div class="header">
      <div class="logo-wrap">
        <img class="logo-img" src="./images/Horiz-Logo.png" alt="Rick's Radar Logo" width="320" height="140">
      </div>

      <div class="filters">
        <button class="pill pill--primary">
          <span class="dot"></span>
          Filters
        </button>
        <button class="pill food">
          <span class="dot"></span>
          Food
        </button>
        <button class="pill groceries">
          <span class="dot"></span>
          Groceries
        </button>
        <button class="pill services">
          <span class="dot"></span>
          Services
        </button>
        <button class="pill other">
          <span class="dot"></span>
          Other
        </button>
      </div>
    </div>

    <main class="deals" id="home-deals-list"></main>
    <p id="home-deals-empty" class="deals-empty-message" style="display:none;">No deals have been posted yet.</p>
  </div>
</body>
</html>
