name: Deploy Docs to Firebase Hosting
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs-hosting-deploy.yml'
      - 'package.json'

jobs:
  build_and_deploy_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/docusaurus/package-lock.json

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs/docusaurus

      - name: Build docs
        run: npm run build
        working-directory: docs/docusaurus

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RICKSRADAR }}
          channelId: live
          projectId: ricksradar
          entryPoint: docs/docusaurus
